{% extends "base.html" %}
{% import "_icons.html" as icons %}

{% block title %}Вход — LUKOIL NOMAD{% endblock %}

{% block body %}
<main class="auth-page">
    <form class="auth-form" method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <span class="auth-form__mark"></span>
        <h1>LUKOIL NOMAD</h1>
        <p class="subtitle">Вход в админ-панель</p>

        {% if error %}
        <p class="error">{{ icons.svg("alert-triangle", 15) }} {{ error }}</p>
        {% endif %}

        <label for="username">Логин</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit">{{ icons.svg("lock", 16) }} Войти</button>
    </form>
</main>
{% endblock %}
