services:
  worker:
    volumes:
      - /root/secrets/google_vision_credentials.json:/run/secrets/google_vision_credentials.json:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - admin-panel
      - minio

volumes:
  caddy-data:
  caddy-config:
